services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ri_lpr
      POSTGRES_USER: ri_lpr
      POSTGRES_PASSWORD: ri_lpr
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
      - worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ri_lpr:ri_lpr@db:5432/ri_lpr
      MEDIA_ROOT: /app/backend/media
      # the admin panel's "تست ارتباط" button calls the worker's own
      # internal test API over the compose network - see
      # worker/test_server.py.
      WORKER_INTERNAL_URL: http://worker:9000
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/backend/media

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ri_lpr:ri_lpr@db:5432/ri_lpr
      MEDIA_ROOT: /app/backend/media
    expose:
      - "9000"  # internal only - test_server.py, never published to the host
    volumes:
      - media_data:/app/backend/media

networks:
  default:
    ipam:
      config:
        # Docker's auto-assigned default (something in 172.1[7-9].0.0/16)
        # collided with the real camera VLAN (172.18.28.0/24) - the
        # host's own routing table then sent traffic meant for the
        # cameras into this bridge instead of the real NIC, breaking
        # connectivity to them even from the host itself (not just from
        # containers). Pinned to a range far from anything in use here
        # (172.16.x - Rahkaran, 172.18.x - cameras, 192.168.201.x - this
        # server) to avoid it happening again.
        - subnet: 10.90.90.0/24

volumes:
  db_data:
  media_data:
