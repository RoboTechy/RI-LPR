{% extends "base.html" %}
{% block title %}ورود - RI-LPR{% endblock %}
{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;">
  <div class="card" style="max-width:380px;width:100%;">
    <div style="text-align:center;margin-bottom:8px;">
      <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff;font-weight:800;font-size:15px;">RI</div>
      <h3 style="margin-bottom:2px;">ورود به پنل مدیریت</h3>
      <p class="hint">سامانه تشخیص پلاک RI-LPR</p>
    </div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <label>نام کاربری</label>
      <input type="text" name="username" required autofocus>
      <label>رمز عبور</label>
      <input type="password" name="password" required>
      <div class="form-actions">
        <button class="btn" type="submit" style="width:100%;justify-content:center;">ورود</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
