{% extends "base.html" %}
{% block title %}کاربر - RI-LPR{% endblock %}
{% block content %}
<div class="card form-card">
  <h3>{{ "ویرایش کاربر" if user else "افزودن کاربر" }}</h3>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ '/admin/users/' ~ user.id ~ '/edit' if user else '/admin/users/new' }}">
    <label>نام کاربری</label>
    <input type="text" name="username" value="{{ user.username if user else '' }}" required>

    <label>رمز عبور {{ "(خالی بگذارید تا تغییر نکند)" if user else "" }}</label>
    <input type="password" name="password" {{ "required" if not user else "" }}>

    <div class="checkbox-row">
      <label><input type="checkbox" name="is_superuser" {{ "checked" if user and user.is_superuser else "" }}> مدیر کل (دسترسی به همه دوربین‌ها)</label>
    </div>

    <label>دسترسی به دوربین‌های خاص (اگه مدیر کل نباشه)</label>
    <div class="card" style="background:var(--surface-alt);padding:12px 16px;margin-top:6px;">
      {% for c in cameras %}
        <div class="checkbox-row" style="margin:6px 0;">
          <label style="font-weight:500;">
            <input type="checkbox" name="camera_ids" value="{{ c.id }}"
              {{ "checked" if user and c in user.cameras else "" }}>
            {{ c.name }} <span class="hint">(لاین {{ c.line_number }})</span>
          </label>
        </div>
      {% else %}
        <div class="hint">هنوز دوربینی ثبت نشده</div>
      {% endfor %}
    </div>

    <div class="form-actions">
      <button class="btn" type="submit">ذخیره</button>
      <a class="btn secondary" href="/admin/users">انصراف</a>
    </div>
  </form>
</div>
{% endblock %}
