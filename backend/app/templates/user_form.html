{% extends "base.html" %}
{% block title %}کاربر - RI-LPR{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;">
  <h3>{{ "ویرایش کاربر" if user else "افزودن کاربر" }}</h3>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ '/admin/users/' ~ user.id ~ '/edit' if user else '/admin/users/new' }}">
    <label>نام کاربری</label>
    <input type="text" name="username" value="{{ user.username if user else '' }}" required>

    <label>رمز عبور {{ "(خالی بگذارید تا تغییر نکند)" if user else "" }}</label>
    <input type="password" name="password" {{ "required" if not user else "" }}>

    <label><input type="checkbox" name="is_superuser" {{ "checked" if user and user.is_superuser else "" }} style="width:auto;display:inline;"> مدیر کل (دسترسی به همه دوربین‌ها)</label>

    <label>دسترسی به دوربین‌های خاص (اگه مدیر کل نباشه)</label>
    {% for c in cameras %}
      <label style="font-weight:normal;">
        <input type="checkbox" name="camera_ids" value="{{ c.id }}" style="width:auto;display:inline;"
          {{ "checked" if user and c in user.cameras else "" }}>
        {{ c.name }}
      </label>
    {% endfor %}

    <div style="margin-top:16px;">
      <button class="btn" type="submit">ذخیره</button>
      <a class="btn secondary" href="/admin/users">انصراف</a>
    </div>
  </form>
</div>
{% endblock %}
